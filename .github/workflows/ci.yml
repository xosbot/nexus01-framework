name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff (legacy debt acknowledged)
        run: |
          ruff check . || echo "legacy lint debt acknowledged"
          ruff check . --statistics | tail -1 || true

  xos-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: XOS control plane must be ruff clean (F,I)
        run: |
          echo "Checking XOS files for critical issues (F,I)..."
          ruff check --select F,I core/authority.py core/policy.py agents/executor.py gateway/gateway.py api/server.py config.py tests/test_authority.py tests/test_authority_compat.py tests/test_xos_hardening.py tests/test_xos_v012.py nodes/ tests/test_nodes_runtime.py scripts/xos_mock_node.py scripts/xos_node_proof_001.py
          echo "XOS gate passed"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v --tb=short

  build:
    needs: [xos-gate, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        if: hashFiles('Dockerfile') != ''
        run: docker build -t nexus01:latest .

      - name: Smoke test
        if: hashFiles('Dockerfile') != ''
        run: |
          docker run --rm nexus01:latest python -c "from core.bus import MessageBus; print('Docker smoke test OK')"